<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Work Order Allocation Tracker</title>
<style>
  :root {
    --brown: #7a3b1e;
    --teal: #1a6b8a;
    --purple: #7a2a6b;
    --green: #2fa63f;
  }
  * { box-sizing: border-box; }
  body { font-family: Segoe UI, Arial, sans-serif; margin: 0; background: #f4f4f6; color: #222; }
  header { background: var(--purple); color: white; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; margin: 0; }
  #login-screen { max-width: 340px; margin: 80px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  #login-screen input { width: 100%; padding: 8px; margin: 6px 0 14px; border: 1px solid #ccc; border-radius: 4px; }
  #login-screen button, .action-btn { background: var(--teal); color: white; border: none; padding: 9px 16px; border-radius: 4px; cursor: pointer; }
  #login-screen button:hover, .action-btn:hover { opacity: .9; }
  #app { display: none; padding: 16px; }
  table { border-collapse: collapse; width: 100%; background: white; font-size: 12px; }
  th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; white-space: nowrap; }
  th.tl { background: var(--brown); color: white; }
  th.inv { background: var(--teal); color: white; }
  th.col { background: var(--purple); color: white; }
  th.tat { background: var(--green); color: white; }
  tr:nth-child(even) { background: #fafafa; }
  input.cell-edit { width: 90px; font-size: 12px; padding: 2px 4px; }
  #toolbar { margin-bottom: 12px; display: flex; gap: 10px; align-items: center; }
  .badge { background: #eee; padding: 4px 10px; border-radius: 12px; font-size: 12px; }
  #error-msg { color: #c0392b; font-size: 13px; min-height: 18px; }
</style>
</head>
<body>

<div id="login-screen">
  <h2>Work Order Tracker</h2>
  <label>Username</label>
  <input id="login-username" autocomplete="username">
  <label>Password</label>
  <input id="login-password" type="password" autocomplete="current-password">
  <div id="error-msg"></div>
  <button onclick="login()">Log In</button>
</div>

<div id="app">
  <header>
    <h1>Work Order Allocation Tracker</h1>
    <div>
      <span id="whoami" class="badge"></span>
      <button class="action-btn" onclick="logout()">Log out</button>
    </div>
  </header>

  <div style="padding: 16px;">
    <div id="toolbar">
      <span id="role-note" class="badge"></span>
      <input type="file" id="import-file" style="display:none;">
      <button class="action-btn" id="import-btn" style="display:none;" onclick="document.getElementById('import-file').click()">Import Inventory CSV</button>
      <button class="action-btn" id="run-assign-btn" style="display:none;" onclick="runAssignment()">Run Assignment Now</button>
      <button class="action-btn" id="clear-data-btn" style="display:none; background:#b23b3b;" onclick="clearAllData()">Clear All Data</button>
      <button class="action-btn" id="production-btn" style="display:none;" onclick="showProductionView()">Production</button>
      <button class="action-btn" onclick="loadOrders()">Refresh</button>
      <button class="action-btn" id="submit-day-btn" style="display:none; background:#2fa63f;" onclick="submitEndOfDay()">Submit End of Day</button>
    </div>
    <div id="production-bar" style="display:none; flex-direction:column; gap:10px; margin-bottom:12px;">
      <div style="display:flex; gap:14px; align-items:center; flex-wrap:wrap;">
        <label>Date Field
          <select id="prod-date-field" onchange="onDateFieldChange()">
            <option value="posted">Posted Date</option>
            <option value="received">Received Date</option>
            <option value="assigned">Assigned Date</option>
            <option value="created">Created</option>
          </select>
        </label>
        <label>From <input type="date" id="prod-date-from"></label>
        <label>To <input type="date" id="prod-date-to"></label>
      </div>
      <div style="display:flex; gap:14px; align-items:center; flex-wrap:wrap;">
        <label>Filter By
          <select id="prod-filter-field" onchange="onFilterFieldChange()"></select>
        </label>
        <select id="prod-filter-values" multiple size="5" style="min-width:200px;"></select>
        <span style="font-size:12px; color:#666;">Ctrl/Cmd-click to select multiple</span>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="action-btn" onclick="loadProduction()">Load</button>
        <button class="action-btn" onclick="exportProductionCSV()">Export CSV</button>
        <button class="action-btn" onclick="clearProductionFilters()">Clear Filters</button>
        <button class="action-btn" onclick="showActiveView()">Back to Active Queue</button>
      </div>
    </div>
    <div id="grid-container"></div>
  </div>
</div>

<script>
const API = ""; // same origin
let token = localStorage.getItem("wot_token") || "";
let role = localStorage.getItem("wot_role") || "";
let fullName = localStorage.getItem("wot_name") || "";

const COLUMNS = [
  {k:"received_date", label:"Received Date", group:"tl"},
  {k:"assigned_date", label:"Assigned Date", group:"tl"},
  {k:"employee_id", label:"Employee", group:"tl"},
  {k:"employee_name", label:"Employee Name", group:"tl"},
  {k:"edm", label:"EDM", group:"inv"},
  {k:"status", label:"Status", group:"inv"},
  {k:"created", label:"Created", group:"inv"},
  {k:"image_count", label:"Image", group:"inv"},
  {k:"doc_count", label:"Doc", group:"inv"},
  {k:"def_doc_type", label:"Def Doc Type", group:"inv"},
  {k:"amount", label:"Amount", group:"inv", currency:true},
  {k:"description", label:"Description", group:"inv"},
  {k:"division", label:"Division", group:"inv"},
  {k:"deposit_date", label:"Deposit Date", group:"inv"},
  {k:"posted_amount", label:"Posted $", group:"col", currency:true},
  {k:"pending_amount", label:"Pending $", group:"col", currency:true},
  {k:"bar_batch", label:"BAR Batch", group:"col"},
  {k:"trans_count", label:"Trans Count", group:"col"},
  {k:"posting_status", label:"Posting Status", group:"col"},
  {k:"poster_comment", label:"Poster Comment", group:"col"},
  {k:"ventra_comment", label:"VENTRA Comment", group:"col"},
  {k:"escalation_category", label:"Escalation Category", group:"col"},
  {k:"issue_raised_date", label:"Issue Raised Date", group:"col"},
  {k:"issue_closed_date", label:"Issue Closed Date", group:"col"},
  {k:"posted_date", label:"Posted Date", group:"col"},
  {k:"tat_days", label:"TAT", group:"tat"},
];

// A-D fields are now auto-populated on import/assignment, never manually typed.
const TL_FIELDS = [];
// Fields a Team Lead can correct on a row that's Completed but not yet
// submitted to Production — same set a colleague fills in, minus the
// always-derived Pending $.
const TL_CORRECTION_FIELDS = ["posted_amount","bar_batch","trans_count","posting_status",
  "poster_comment","ventra_comment","escalation_category","issue_raised_date","issue_closed_date","posted_date"];
const COL_FIELDS = ["posted_amount","bar_batch","trans_count","posting_status",
  "poster_comment","ventra_comment","escalation_category","issue_raised_date","issue_closed_date"];
const CLARIFICATION_ONLY_FIELDS = ["poster_comment","ventra_comment","escalation_category",
  "issue_raised_date","issue_closed_date"];
// Colleagues don't need to see the Team-Lead-owned columns at all.
const HIDDEN_FOR_COLLEAGUE = ["received_date","assigned_date","employee_id","employee_name"];
const POSTING_STATUS_OPTIONS = ["In-Process", "Clarification", "Completed"];
const ESCALATION_OPTIONS = ["Patient not found", "DUVA Verification", "EOB not found", "Invoice Creation", "Other"];

function formatCurrency(val) {
  if (val === null || val === undefined || val === "") return "";
  const num = parseFloat(val);
  if (isNaN(num)) return val;
  return "$" + num.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function parseCurrency(val) {
  if (val === "" || val === null || val === undefined) return null;
  const cleaned = String(val).replace(/[^0-9.-]/g, "");
  return cleaned === "" ? null : cleaned;
}

if (token) showApp();
let currentOrders = [];
let currentProduction = [];
let colleagueList = [];
let viewMode = "active"; // "active" or "production"
let drafts = {}; // order.id -> {field: value} pending unsaved edits

async function login() {
  const username = document.getElementById("login-username").value;
  const password = document.getElementById("login-password").value;
  const body = new URLSearchParams({username, password});
  const res = await fetch(API + "/auth/login", {method:"POST", body});
  if (!res.ok) {
    document.getElementById("error-msg").textContent = "Login failed. Check username/password.";
    return;
  }
  const data = await res.json();
  token = data.access_token; role = data.role; fullName = data.full_name;
  localStorage.setItem("wot_token", token);
  localStorage.setItem("wot_role", role);
  localStorage.setItem("wot_name", fullName);
  showApp();
}

function logout() {
  localStorage.clear();
  location.reload();
}

function showApp() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("whoami").textContent = `${fullName} (${role})`;
  document.getElementById("role-note").textContent = role === "team_lead"
    ? "Received Date, Assigned Date, Employee, and Employee Name are set automatically. Completed rows can still be corrected until submitted."
    : "Edit fields, then click Save. Pending $ is auto-calculated. Locked once Completed \u2014 click Submit End of Day to send finished work to Production. Use Production to view/export your own submitted history.";
  if (role === "team_lead") {
    document.getElementById("import-btn").style.display = "inline-block";
    document.getElementById("run-assign-btn").style.display = "inline-block";
    document.getElementById("clear-data-btn").style.display = "inline-block";
    document.getElementById("production-btn").style.display = "inline-block";
    document.getElementById("import-file").addEventListener("change", importCSV);
    loadColleagueList();
  } else {
    document.getElementById("submit-day-btn").style.display = "inline-block";
    document.getElementById("production-btn").style.display = "inline-block";
  }
  loadOrders();
}

async function authFetch(path, opts={}) {
  opts.headers = Object.assign({}, opts.headers, {"Authorization": "Bearer " + token});
  const res = await fetch(API + path, opts);
  if (res.status === 401) { logout(); throw new Error("Session expired"); }
  return res;
}

async function importCSV(e) {
  const file = e.target.files[0];
  if (!file) return;
  const form = new FormData();
  form.append("file", file);
  const res = await authFetch("/orders/import", {method:"POST", body: form});
  const data = await res.json();
  alert(`Imported ${data.imported} rows`);
  loadOrders();
}

async function runAssignment() {
  const res = await authFetch("/orders/run-assignment", {method:"POST"});
  if (!res.ok) {
    alert("Assignment run failed: " + (await res.text()));
    return;
  }
  alert("Assignment pass complete.");
  loadOrders();
}

async function clearAllData() {
  const sure = confirm("This will permanently delete ALL imported work orders (not user logins). This cannot be undone. Continue?");
  if (!sure) return;
  const typed = prompt('Type DELETE to confirm.');
  if (typed !== "DELETE") {
    alert("Cancelled — nothing was deleted.");
    return;
  }
  const res = await authFetch("/orders/all", {method:"DELETE"});
  if (!res.ok) {
    alert("Delete failed: " + (await res.text()));
    return;
  }
  const data = await res.json();
  alert(`Deleted ${data.deleted} work order(s).`);
  loadOrders();
}

async function submitEndOfDay() {
  const sure = confirm("Submit all your Completed orders to Production? Once submitted, they can no longer be corrected by you or your Team Lead.");
  if (!sure) return;
  const res = await authFetch("/orders/submit-day", {method:"POST"});
  if (!res.ok) {
    alert("Submit failed: " + (await res.text()));
    return;
  }
  const data = await res.json();
  alert(`Submitted ${data.submitted} order(s) to Production.`);
  loadOrders();
}

const DATE_FIELD_PARAMS = {
  posted: ["start_date", "end_date"],
  received: ["received_start", "received_end"],
  assigned: ["assigned_start", "assigned_end"],
  created: ["created_start", "created_end"],
};
const VALUE_FILTER_FIELDS = ["employee_name", "def_doc_type", "division", "escalation_category", "posting_status"];
const FILTER_FIELD_OPTIONS = [
  {value: "employee_name", label: "Employee Name", teamLeadOnly: true},
  {value: "def_doc_type", label: "Def Doc Type"},
  {value: "division", label: "Division"},
  {value: "escalation_category", label: "Escalation Category"},
  {value: "posting_status", label: "Posting Status"},
];

function populateFilterFieldDropdown() {
  const sel = document.getElementById("prod-filter-field");
  sel.innerHTML = "";
  FILTER_FIELD_OPTIONS.forEach(opt => {
    if (opt.teamLeadOnly && role !== "team_lead") return;
    const o = document.createElement("option");
    o.value = opt.value;
    o.textContent = opt.label;
    sel.appendChild(o);
  });
}

let dateFilters = {posted:{from:"",to:""}, received:{from:"",to:""}, assigned:{from:"",to:""}, created:{from:"",to:""}};
let valueFilters = {employee_name:[], def_doc_type:[], division:[], escalation_category:[], posting_status:[]};
let productionAllForOptions = [];

async function showProductionView() {
  viewMode = "production";
  document.getElementById("toolbar").style.display = "none";
  document.getElementById("production-bar").style.display = "flex";

  dateFilters = {posted:{from:"",to:""}, received:{from:"",to:""}, assigned:{from:"",to:""}, created:{from:"",to:""}};
  valueFilters = {employee_name:[], def_doc_type:[], division:[], escalation_category:[], posting_status:[]};
  document.getElementById("prod-date-field").value = "posted";
  populateFilterFieldDropdown();
  document.getElementById("prod-filter-field").value = role === "team_lead" ? "employee_name" : "def_doc_type";
  document.getElementById("prod-date-from").value = "";
  document.getElementById("prod-date-to").value = "";

  const res = await authFetch("/orders/production");
  if (res.ok) productionAllForOptions = await res.json();
  populateFilterValueOptions();
  loadProduction();
}

function showActiveView() {
  viewMode = "active";
  document.getElementById("toolbar").style.display = "flex";
  document.getElementById("production-bar").style.display = "none";
  loadOrders();
}

function onDateFieldChange() {
  const prevField = document.getElementById("prod-date-field").dataset.prev || "posted";
  dateFilters[prevField] = {
    from: document.getElementById("prod-date-from").value,
    to: document.getElementById("prod-date-to").value,
  };
  const field = document.getElementById("prod-date-field").value;
  document.getElementById("prod-date-field").dataset.prev = field;
  document.getElementById("prod-date-from").value = dateFilters[field].from || "";
  document.getElementById("prod-date-to").value = dateFilters[field].to || "";
}

function onFilterFieldChange() {
  syncCurrentFilterSelection();
  populateFilterValueOptions();
}

function syncCurrentFilterSelection() {
  const field = document.getElementById("prod-filter-field").dataset.prev || document.getElementById("prod-filter-field").value;
  const sel = document.getElementById("prod-filter-values");
  valueFilters[field] = Array.from(sel.selectedOptions).map(o => o.value);
  document.getElementById("prod-filter-field").dataset.prev = document.getElementById("prod-filter-field").value;
}

function populateFilterValueOptions() {
  const field = document.getElementById("prod-filter-field").value;
  const distinct = Array.from(new Set(
    productionAllForOptions.map(o => o[field]).filter(v => v !== null && v !== undefined && v !== "")
  )).sort();
  const sel = document.getElementById("prod-filter-values");
  sel.innerHTML = "";
  distinct.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = v;
    if ((valueFilters[field] || []).includes(v)) opt.selected = true;
    sel.appendChild(opt);
  });
}

async function loadProduction() {
  // Capture whatever's currently showing in the two dropdowns before building params.
  const activeDateField = document.getElementById("prod-date-field").value;
  dateFilters[activeDateField] = {
    from: document.getElementById("prod-date-from").value,
    to: document.getElementById("prod-date-to").value,
  };
  syncCurrentFilterSelection();

  const params = new URLSearchParams();
  for (const [field, {from, to}] of Object.entries(dateFilters)) {
    const [fromParam, toParam] = DATE_FIELD_PARAMS[field];
    if (from) params.set(fromParam, from);
    if (to) params.set(toParam, to);
  }
  for (const field of VALUE_FILTER_FIELDS) {
    const values = valueFilters[field] || [];
    if (values.length) params.set(field, values.join(","));
  }

  const res = await authFetch("/orders/production?" + params.toString());
  if (!res.ok) {
    alert("Failed to load Production data: " + (await res.text()));
    return;
  }
  currentProduction = await res.json();
  renderProductionGrid(currentProduction);
}

function clearProductionFilters() {
  dateFilters = {posted:{from:"",to:""}, received:{from:"",to:""}, assigned:{from:"",to:""}, created:{from:"",to:""}};
  valueFilters = {employee_name:[], def_doc_type:[], division:[], escalation_category:[], posting_status:[]};
  document.getElementById("prod-date-from").value = "";
  document.getElementById("prod-date-to").value = "";
  populateFilterValueOptions();
  loadProduction();
}

function renderProductionGrid(orders) {
  let html = "<table><thead><tr>";
  COLUMNS.forEach(c => html += `<th class="${c.group}">${c.label}</th>`);
  html += `<th class="col">Submitted At</th>`;
  html += "</tr></thead><tbody>";
  orders.forEach(o => {
    html += "<tr>";
    COLUMNS.forEach(c => {
      const val = o[c.k] ?? "";
      html += `<td>${c.currency ? formatCurrency(val) : val}</td>`;
    });
    html += `<td>${o.submitted_at ?? ""}</td>`;
    html += "</tr>";
  });
  html += "</tbody></table>";
  document.getElementById("grid-container").innerHTML = html ||
    "<p>No production records in this range.</p>";
  if (orders.length === 0) {
    document.getElementById("grid-container").innerHTML = "<p>No production records in this range.</p>";
  }
}

function exportProductionCSV() {
  if (!currentProduction.length) {
    alert("Nothing to export \u2014 load a date range first.");
    return;
  }
  const headers = COLUMNS.map(c => c.label).concat(["Submitted At"]);
  const keys = COLUMNS.map(c => c.k).concat(["submitted_at"]);
  const rows = currentProduction.map(o =>
    keys.map(k => {
      let v = o[k] ?? "";
      v = String(v).replace(/"/g, '""');
      return `"${v}"`;
    }).join(",")
  );
  const csv = [headers.join(","), ...rows].join("\r\n");
  const blob = new Blob([csv], {type: "text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const activeDateField = document.getElementById("prod-date-field").value;
  const start = dateFilters[activeDateField].from || "all";
  const end = dateFilters[activeDateField].to || "all";
  a.href = url;
  a.download = `production_${start}_to_${end}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function loadColleagueList() {
  const res = await authFetch("/users/colleagues");
  if (res.ok) colleagueList = await res.json();
}

async function reassignOrder(orderId, newColleagueId, selectEl) {
  if (!newColleagueId) return;
  const colleague = colleagueList.find(c => c.id === parseInt(newColleagueId));
  const sure = confirm(`Reassign this order to ${colleague ? colleague.full_name : "this colleague"}?`);
  if (!sure) {
    loadOrders(); // reset the dropdown back to its saved value
    return;
  }
  const res = await authFetch(`/orders/${orderId}/reassign`, {
    method: "PATCH",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({assigned_to_id: parseInt(newColleagueId)})
  });
  if (!res.ok) {
    alert("Reassign failed: " + (await res.text()));
    loadOrders();
    return;
  }
  loadOrders();
}

async function loadOrders() {
  const res = await authFetch("/orders");
  currentOrders = await res.json();
  drafts = {};
  renderGrid(currentOrders);
}

function effectiveValue(o, field) {
  const d = drafts[o.id];
  if (d && Object.prototype.hasOwnProperty.call(d, field)) return d[field];
  return o[field];
}

function visibleColumns() {
  if (role === "colleague") {
    return COLUMNS.filter(c => !HIDDEN_FOR_COLLEAGUE.includes(c.k));
  }
  return COLUMNS;
}

function renderGrid(orders) {
  const cols = visibleColumns();
  let html = "<table><thead><tr>";
  cols.forEach(c => html += `<th class="${c.group}">${c.label}</th>`);
  if (role === "colleague" || role === "team_lead") html += `<th class="col">Action</th>`;
  html += "</tr></thead><tbody>";

  orders.forEach(o => {
    const savedCompleted = o.posting_status === "Completed";
    const locked = role === "colleague" && savedCompleted;
    // Team Lead can only correct a row once it's Completed but not yet
    // submitted (submitted rows are already excluded from this list).
    const tlCanCorrect = role === "team_lead" && savedCompleted;
    const effStatus = effectiveValue(o, "posting_status");
    const hasDraft = drafts[o.id] && Object.keys(drafts[o.id]).length > 0;

    html += `<tr>`;
    cols.forEach(c => {
      const editableBase = (role === "team_lead" && (TL_FIELDS.includes(c.k) || (tlCanCorrect && TL_CORRECTION_FIELDS.includes(c.k)))) ||
                            (role === "colleague" && COL_FIELDS.includes(c.k));
      let editable = editableBase && !locked;
      // The Clarification-only gating is a colleague data-entry rule, not a
      // restriction on trusted Team Lead corrections.
      if (role === "colleague" && editable && CLARIFICATION_ONLY_FIELDS.includes(c.k) && effStatus !== "Clarification") {
        editable = false;
      }
      const rawVal = effectiveValue(o, c.k) ?? "";

      if (c.k === "posting_status" && editable) {
        html += `<td><select class="cell-edit" data-id="${o.id}" data-field="posting_status" onchange="updateDraft(this)">`;
        POSTING_STATUS_OPTIONS.forEach(opt => {
          html += `<option value="${opt}" ${opt === rawVal ? "selected" : ""}>${opt}</option>`;
        });
        html += `</select></td>`;
        return;
      }

      if (c.k === "escalation_category" && (role === "colleague" || role === "team_lead")) {
        html += `<td><select class="cell-edit" data-id="${o.id}" data-field="escalation_category" onchange="updateDraft(this)" ${editable ? "" : "disabled"}>`;
        html += `<option value=""></option>`;
        ESCALATION_OPTIONS.forEach(opt => {
          html += `<option value="${opt}" ${opt === rawVal ? "selected" : ""}>${opt}</option>`;
        });
        html += `</select></td>`;
        return;
      }

      if ((c.k === "poster_comment" || c.k === "ventra_comment") && (role === "colleague" || role === "team_lead")) {
        html += `<td><input class="cell-edit" data-id="${o.id}" data-field="${c.k}" value="${rawVal}" onchange="updateDraft(this)" ${editable ? "" : "disabled"}></td>`;
        return;
      }

      if (c.k === "posted_date") {
        // Auto-set the moment an order is marked Completed — never a manual
        // input for a colleague. A Team Lead correcting an unsubmitted row
        // can override it directly.
        if (role === "team_lead" && editable) {
          html += `<td><input class="cell-edit" data-id="${o.id}" data-field="posted_date" value="${rawVal}" placeholder="YYYY-MM-DD" onchange="updateDraft(this)"></td>`;
        } else {
          html += `<td>${rawVal}</td>`;
        }
        return;
      }

      if (c.currency) {
        if (editable) {
          html += `<td><input class="cell-edit" data-id="${o.id}" data-field="${c.k}" data-currency="1" value="${rawVal === "" ? "" : formatCurrency(rawVal)}" onchange="updateDraft(this)"></td>`;
        } else {
          html += `<td>${formatCurrency(rawVal)}</td>`;
        }
        return;
      }

      if (editable) {
        html += `<td><input class="cell-edit" data-id="${o.id}" data-field="${c.k}" value="${rawVal}" onchange="updateDraft(this)"></td>`;
      } else {
        html += `<td>${rawVal}</td>`;
      }
    });

    if (role === "colleague") {
      if (locked) {
        html += `<td>Locked</td>`;
      } else {
        html += `<td><button class="action-btn" onclick="saveRow(${o.id})" ${hasDraft ? "" : "disabled"}>Save</button></td>`;
      }
    } else if (role === "team_lead") {
      if (tlCanCorrect) {
        html += `<td><button class="action-btn" onclick="saveRow(${o.id})" ${hasDraft ? "" : "disabled"}>Save</button></td>`;
      } else {
        html += `<td><select onchange="reassignOrder(${o.id}, this.value)">`;
        html += `<option value="">Reassign\u2026</option>`;
        colleagueList.forEach(c => {
          const isCurrent = c.id === o.assigned_to_id;
          html += `<option value="${c.id}" ${isCurrent ? "selected" : ""}>${c.full_name}${isCurrent ? " (current)" : ""}</option>`;
        });
        html += `</select></td>`;
      }
    }
    html += `</tr>`;
  });
  html += "</tbody></table>";
  document.getElementById("grid-container").innerHTML = html || "<p>No orders.</p>";
}

function updateDraft(input) {
  const id = parseInt(input.dataset.id);
  const field = input.dataset.field;
  let value = input.value;
  if (value === "") value = null;
  if (!drafts[id]) drafts[id] = {};
  drafts[id][field] = value;

  // Live Pending $ preview: Amount - Posted $, recalculated the moment
  // Posted $ changes, before the row is even saved.
  if (field === "posted_amount") {
    const order = currentOrders.find(o => o.id === id);
    const parsedPosted = parseFloat(parseCurrency(value));
    if (order && order.amount !== null && order.amount !== undefined && !isNaN(parsedPosted)) {
      drafts[id]["pending_amount"] = (order.amount - parsedPosted).toString();
    } else {
      delete drafts[id]["pending_amount"];
    }
  }

  // Note: Escalation Category / Issue Raised Date are cleared automatically
  // by the backend when Posting Status leaves Clarification — intentionally
  // not mirrored here, since sending explicit nulls for them would itself
  // trip the "only editable during Clarification" check.

  renderGrid(currentOrders);
}

async function saveRow(orderId) {
  const draft = drafts[orderId];
  if (!draft || Object.keys(draft).length === 0) return;
  const order = currentOrders.find(o => o.id === orderId);

  const payload = {};
  for (const [field, value] of Object.entries(draft)) {
    if (field === "pending_amount") continue; // preview-only, server recalculates
    payload[field] = (field === "posted_amount") ? parseCurrency(value) : value;
  }

  if (role === "team_lead") {
    // Trusted correction — no required-field or Clarification-only gating.
    const res = await authFetch(`/orders/${orderId}/team-lead-correction`, {
      method: "PATCH",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      alert("Save failed: " + (await res.text()));
      return;
    }
    delete drafts[orderId];
    loadOrders();
    return;
  }

  const finalStatus = draft.posting_status !== undefined ? draft.posting_status : order.posting_status;
  const finalPosted = draft.posted_amount !== undefined ? draft.posted_amount : order.posted_amount;
  const finalBar = draft.bar_batch !== undefined ? draft.bar_batch : order.bar_batch;
  const finalTrans = draft.trans_count !== undefined ? draft.trans_count : order.trans_count;

  const missing = [];
  if (finalPosted === null || finalPosted === undefined || finalPosted === "") missing.push("Posted $");
  if (!finalBar) missing.push("BAR Batch");
  if (finalTrans === null || finalTrans === undefined || finalTrans === "") missing.push("Trans Count");
  if (missing.length) {
    alert("Cannot save \u2014 missing required: " + missing.join(", "));
    return;
  }

  if (finalStatus !== "Clarification") {
    const blocked = CLARIFICATION_ONLY_FIELDS.filter(f =>
      f in draft && draft[f] !== null && draft[f] !== ""
    );
    if (blocked.length) {
      alert("Cannot edit " + blocked.join(", ") + " unless Posting Status is Clarification");
      return;
    }
  }

  const res = await authFetch(`/orders/${orderId}/colleague`, {
    method: "PATCH",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  });
  if (!res.ok) {
    alert("Save failed: " + (await res.text()));
    return;
  }
  delete drafts[orderId];
  loadOrders();
}
</script>
</body>
</html>
